<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Discord Phoenix — cliente nativo em Rust + egui">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#171a24"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="0.55" stop-color="#9B5CF6"/>
      <stop offset="1" stop-color="#EB459E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5865F2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#5865F2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#2a2d3a"/>

  <circle cx="168" cy="150" r="150" fill="url(#halo)"/>
  <circle cx="168" cy="150" r="58" fill="url(#flame)" filter="url(#shadow)"/>
  <text x="168" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">DP</text>

  <text x="272" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#f2f3f5" letter-spacing="1">DISCORD PHOENIX</text>
  <text x="276" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#a8adba">Cliente nativo em Rust + egui, leve por design.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="276" y="204" width="152" height="34" rx="17" fill="#1e2130" stroke="#34384b"/>
    <text x="352" y="226" text-anchor="middle" fill="#c9cdf7">sem Electron</text>

    <rect x="438" y="204" width="122" height="34" rx="17" fill="#1e2130" stroke="#34384b"/>
    <text x="499" y="226" text-anchor="middle" fill="#c9cdf7">sem Chromium</text>

    <rect x="570" y="204" width="118" height="34" rx="17" fill="#1e2130" stroke="#34384b"/>
    <text x="629" y="226" text-anchor="middle" fill="#c9cdf7">GIF + embeds</text>

    <rect x="698" y="204" width="126" height="34" rx="17" fill="#1e2130" stroke="#34384b"/>
    <text x="761" y="226" text-anchor="middle" fill="#c9cdf7">markdown</text>

    <rect x="834" y="204" width="152" height="34" rx="17" fill="#1e2130" stroke="#34384b"/>
    <text x="910" y="226" text-anchor="middle" fill="#c9cdf7">~90 MB em demo</text>
  </g>
</svg>
